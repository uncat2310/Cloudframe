# Self-hosted Cloudflare R2 mode. Usage (from this directory):
#   cp .env.example .env   # then fill it in
#   docker compose up -d --build
services:
  cloudframe:
    build:
      context: ..
      dockerfile: Dockerfile
    image: cloudframe-selfhost
    container_name: cloudframe
    env_file: .env
    ports:
      # Behind a reverse proxy on the same host, use "127.0.0.1:3000:3000"
      # so the panel is only reachable through it.
      - "3000:3000"
    restart: unless-stopped
